name: cc-turnos-cprl

services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-cc-turnos-local-secret-change-me}
    networks:
      - backend
    # Compose usa el healthcheck como criterio real de disponibilidad del servicio.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    environment:
      QUEUE_PORT: 4002
      JWT_SECRET: ${JWT_SECRET:-cc-turnos-local-secret-change-me}
    volumes:
      # El volumen conserva los turnos aunque se recree el contenedor.
      - queue-data:/app/services/queue/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  calls:
    build:
      context: .
      dockerfile: services/calls/Dockerfile
    environment:
      CALLS_PORT: 4003
      QUEUE_URL: http://queue:4002
      JWT_SECRET: ${JWT_SECRET:-cc-turnos-local-secret-change-me}
    depends_on:
      queue:
        # Calls no arranca hasta que queue pueda responder su endpoint de salud.
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      queue:
        condition: service_healthy
      calls:
        condition: service_healthy
    networks:
      - frontend
      # Es la red compartida para que el frontend pueda alcanzar las APIs.
      - backend

networks:
  frontend:
  backend:
    # Impide el acceso directo de contenedores externos a los servicios internos.
    internal: true

volumes:
  queue-data:
