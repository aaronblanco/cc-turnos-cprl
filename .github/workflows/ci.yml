name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/auth/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/queue/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/calls/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker compose build
      - run: docker compose up -d
      - run: npm run test:integration
      - if: always()
        run: docker compose down -v

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push auth
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/auth/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-auth:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-auth:latest

      - name: Build and push queue
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/queue/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-queue:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-queue:latest

      - name: Build and push calls
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/calls/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-calls:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-calls:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/cc-turnos-cprl-web:latest
